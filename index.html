<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nadine</title>
<meta name="description" content="Gestiona el contenido, las ideas, los guiones y los resultados de cada empresa que asesoras.">
<meta name="theme-color" content="#800020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" id="fav48">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" id="fav192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" id="apple-icon">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nadine" id="apple-title">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#800020;--brand-d:#600018;--brand-2:#a3173f;--brand-3:#c2185b;--brand-soft:#fbeaef;--brand-soft2:#f3cdd7;--brand-ink:#800020;--on-brand:#fff;
  --navy:#14213d;--bg:#f3f4f7;--card:#fff;--text:#1f2433;--text2:#4b5263;--muted:#6b7280;--muted2:#9aa1ad;--line:#e7e9ef;--line2:#d5d8e0;--soft:#f8f9fb;--hover:#f3f4f6;--glass:rgba(255,255,255,.94);
  --green:#16a34a;--red:#dc2626;--rf:1;--radius:calc(16px * var(--rf));--hw:400;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.05);
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.ic{display:inline-block;vertical-align:middle;flex-shrink:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.topbar{display:none}
.sidebar{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 14px 16px;overflow-y:auto}
.logo{font-weight:800;letter-spacing:.02em;font-size:15px;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo.caps{letter-spacing:.17em}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:38px;width:auto;max-width:160px;object-fit:contain;display:block;border-radius:calc(8px * var(--rf))}
.sidebar .brand{padding:0 12px 24px}
.topbar .brand{justify-content:center;flex:1;padding:0 8px}
.topbar .brand img{height:30px;max-width:130px}
.logo-box{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.logo-prev{width:88px;height:88px;border-radius:calc(18px * var(--rf));border:1.5px dashed var(--line2);display:grid;place-items:center;background:var(--soft);overflow:hidden;flex-shrink:0;color:var(--muted2)}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.logo-prev.has{border-style:solid;background:var(--card)}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;margin:0 0 14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--brand)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:calc(12px * var(--rf));color:var(--text2);font-weight:500;text-decoration:none;margin-bottom:3px;transition:background .15s}
.nav a:hover{background:var(--hover)}
.nav a.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.side-bottom{margin-top:auto;padding-top:12px}
.install-card{background:linear-gradient(140deg,var(--brand-2),var(--brand-d));color:var(--on-brand);border-radius:calc(16px * var(--rf));padding:14px;margin-bottom:12px}
.install-card b{display:block;font-size:13.5px}
.install-card p{margin:4px 0 10px;font-size:12px;opacity:.85}
.install-card button{background:#fff;color:var(--brand);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:calc(10px * var(--rf));display:inline-flex;gap:6px;align-items:center}
.side-bottom .nav{border-top:1px solid var(--line);padding-top:10px}
.main{padding:30px 34px 60px;min-width:0}
.backdrop{display:none}
.bottomnav{display:none}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-family:var(--serif);font-weight:var(--hw);font-size:36px;line-height:1.08;margin:0;color:var(--navy);letter-spacing:-.01em}
.page-head p{margin:6px 0 0;color:var(--muted)}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:calc(12px * var(--rf));font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-d)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:calc(10px * var(--rf));gap:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--red)}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:calc(10px * var(--rf));color:var(--text2)}
.icon-btn:hover{background:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);background:var(--card);border-radius:calc(12px * var(--rf));font-weight:600;font-size:13.5px}
.pill select{border:0;background:transparent;outline:0;font-weight:600;cursor:pointer}

/* ---------- cards & grids ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.mt{margin-top:16px}
.stack>*+*{margin-top:16px}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:calc(12px * var(--rf));border:1px solid var(--line);background:var(--card);font-weight:500;color:var(--text2);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.chip:hover{background:var(--hover)}
.chip.active{background:var(--brand-soft);border-color:var(--brand-soft2);color:var(--brand-ink);font-weight:600}
.pdot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- KPIs ---------- */
.kpi{min-width:0;border-radius:calc(16px * var(--rf));padding:16px;border:1px solid var(--line);background:var(--card)}
.k-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2)}
.k-val{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
.k-delta{font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.k-sub{font-size:12px;color:var(--muted);margin-left:4px;font-weight:500}
.up{color:var(--green)}.down{color:var(--red)}
.tint-blue{background:#f0f6ff;border-color:#dbe7fb}.tint-blue .k-top .ic{color:#2563eb}
.tint-rose{background:#fff2f4;border-color:#fbdde3}.tint-rose .k-top .ic{color:#be123c}
.tint-amber{background:#fff8f0;border-color:#f8e6cf}.tint-amber .k-top .ic{color:#c2410c}
.tint-green{background:#f0fbf3;border-color:#d4f0dc}.tint-green .k-top .ic{color:#15803d}
.tint-violet{background:#f6f2ff;border-color:#e6dcfb}.tint-violet .k-top .ic{color:#7c3aed}

/* ---------- badges / thumbs ---------- */
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:calc(999px * var(--rf));white-space:nowrap}
.b-Reel{background:#fde4ea;color:#b4123e}.b-Carrusel{background:#efe7fd;color:#6d28d9}.b-Historia{background:#e3eefe;color:#1d4ed8}
.b-TikTok{background:#dcfce9;color:#15803d}.b-Post{background:#fef3c7;color:#b45309}.b-YouTube{background:#fee2e2;color:#dc2626}
.thumb{border-radius:calc(10px * var(--rf));display:grid;place-items:center;color:#fff;flex-shrink:0}
.t-Reel{background:linear-gradient(135deg,#f9b4c6,#b4123e)}.t-Carrusel{background:linear-gradient(135deg,#d8c8fb,#6d28d9)}
.t-Historia{background:linear-gradient(135deg,#bcd6fd,#1d4ed8)}.t-TikTok{background:linear-gradient(135deg,#2b3445,#0d9488)}
.t-Post{background:linear-gradient(135deg,#fde68a,#d97706)}.t-YouTube{background:linear-gradient(135deg,#fca5a5,#dc2626)}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ---------- planner ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:calc(16px * var(--rf));padding:10px;display:flex;flex-direction:column;gap:9px;min-height:300px}
.day-h{text-align:center;padding:2px 0 6px}
.day-h .dn{font-size:13px;font-weight:600;color:var(--muted)}
.day-h .dd{font-size:20px;font-weight:800;line-height:1.5;display:inline-block;min-width:36px;border-radius:calc(10px * var(--rf))}
.day.today{border-color:var(--brand-soft2)}
.day.today .dd{background:var(--brand);color:var(--on-brand)}
.post{border:1px solid var(--line);border-radius:calc(12px * var(--rf));padding:7px;text-align:left;width:100%;background:var(--card);display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s,border-color .15s}
.post:hover{border-color:var(--brand-soft2);box-shadow:0 4px 14px rgba(128,0,32,.09)}
.post .thumb{height:64px;width:100%}
.post .pbody{display:flex;flex-direction:column;gap:5px;min-width:0}
.post .pt{font-weight:600;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.post .pm{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.add-slot{border:1.5px dashed var(--line2);border-radius:calc(12px * var(--rf));padding:14px 8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:500;margin-top:auto;width:100%}
.add-slot:hover{border-color:var(--brand);color:var(--brand-ink)}
.week-nav{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:calc(12px * var(--rf));padding:3px}
.week-nav span{font-weight:600;font-size:13.5px;padding:0 8px;white-space:nowrap}

/* ---------- lists ---------- */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow span{font-size:12px;color:var(--muted)}
.clickable{cursor:pointer;width:100%;text-align:left}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:calc(14px * var(--rf));text-align:left;background:var(--card)}
.qa:hover{border-color:var(--brand-soft2);background:var(--hover)}
.qa b{display:block;font-size:13.5px}.qa span{font-size:12px;color:var(--muted)}
.hero{background:linear-gradient(120deg,var(--brand) 0%,var(--brand-2) 60%,var(--brand-3) 100%);color:var(--on-brand);border-radius:calc(20px * var(--rf));padding:26px 28px;position:relative;overflow:hidden;margin-bottom:16px}
.hero h1{font-family:var(--serif);font-weight:var(--hw);font-size:36px;margin:0;line-height:1.1}
.hero p{margin:8px 0 18px;opacity:.88;max-width:520px}
.hero .btn{background:#fff;color:var(--brand);border-color:#fff}
.hero .btn.outline{background:transparent;color:var(--on-brand);border-color:rgba(255,255,255,.5)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}

/* ---------- ideas ---------- */
.cat{display:flex;align-items:center;gap:14px;padding:15px;text-align:left;width:100%;border:1px solid var(--line);border-radius:calc(16px * var(--rf));background:var(--card);transition:border-color .15s,box-shadow .15s}
.cat:hover{border-color:var(--brand-soft2)}
.cat.active{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cico{width:46px;height:46px;border-radius:calc(14px * var(--rf));display:grid;place-items:center;flex-shrink:0}
.cat b{display:block;font-size:14.5px}.cat span{color:var(--muted);font-size:12.5px}
.cat .chev{margin-left:auto;color:var(--muted2)}
.c-rose{background:#fde8ee;color:#be185d}.c-violet{background:#f0e9fe;color:#7c3aed}.c-blue{background:#e6f0fe;color:#2563eb}
.c-green{background:#e3f8ec;color:#16a34a}.c-orange{background:#ffeedd;color:#ea580c}.c-pink{background:#fde7f3;color:#db2777}
.gen-bar{display:flex;gap:10px;align-items:center;padding:7px 7px 7px 16px;border:1px solid var(--line);border-radius:calc(16px * var(--rf));background:var(--card);box-shadow:0 6px 24px rgba(16,24,40,.08);position:sticky;bottom:14px;z-index:5;margin-top:16px}
.gen-bar .ic{color:var(--brand-ink)}
.gen-bar input{flex:1;border:0;outline:0;background:transparent;padding:9px 0;min-width:0}
.result{border:1px solid var(--line);border-radius:calc(14px * var(--rf));padding:14px;background:var(--soft)}
.result+.result{margin-top:10px}
.result .rt{white-space:pre-wrap;overflow-wrap:anywhere}
.result .ra{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.result .rmeta{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
.star-on{color:#d97706}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--text2)}
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:calc(11px * var(--rf));padding:10px 12px;outline:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:calc(12px * var(--rf));padding:10px 12px;margin-bottom:12px}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-wrap.open{display:flex}
.modal{background:var(--card);border-radius:calc(20px * var(--rf));width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;box-shadow:0 24px 48px rgba(0,0,0,.22)}
.modal h2{font-family:var(--serif);font-weight:var(--hw);font-size:27px;margin:0 0 16px;color:var(--navy)}
.modal-foot{display:flex;justify-content:space-between;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap}

/* ---------- automation ---------- */
.flow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 78px 78px auto;gap:14px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.flow:last-child{border-bottom:0}
.fico{width:42px;height:42px;border-radius:calc(12px * var(--rf));display:grid;place-items:center}
.fmain b{display:block;font-size:14px}.fmain span{display:block;font-size:12.5px;color:var(--muted)}
.fmain .fsub{display:none}
.metric b{display:block;font-size:14px}.metric span{font-size:11.5px;color:var(--muted)}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--green)}
.tog.off{color:var(--muted)}
.switch{width:40px;height:23px;border-radius:calc(999px * var(--rf));background:var(--line2);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on .switch{background:#22c55e}.tog.on .switch::after{left:20px}
.fa{display:flex;gap:2px}

/* ---------- scripts ---------- */
.scripts{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.s-item{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:calc(12px * var(--rf));border:1px solid transparent;margin-bottom:4px}
.s-item:hover{background:var(--hover)}
.s-item.active{background:var(--brand-soft);border-color:var(--brand-soft2)}
.s-item b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-item span{font-size:12px;color:var(--muted)}
.dur{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);padding:6px 10px;border-radius:calc(10px * var(--rf))}

/* ---------- stats ---------- */
.chart-svg{width:100%;height:auto;display:block}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:140px}
.legend li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.legend li i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend li b{margin-left:auto}
.tops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.top{border-radius:calc(12px * var(--rf));overflow:hidden;border:1px solid var(--line);background:var(--card);text-align:left;width:100%}
.top .thumb{height:96px;border-radius:0;position:relative;width:100%}
.top .views{position:absolute;bottom:7px;left:8px;font-weight:700;font-size:12.5px;display:flex;gap:4px;align-items:center;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.top .tb{padding:8px;display:flex;flex-direction:column;gap:5px}
.top .tt{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.empty .ic{color:var(--muted2);margin-bottom:6px}
.empty p{margin:4px 0 12px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:#14213d;color:#fff;padding:10px 18px;border-radius:calc(12px * var(--rf));font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-wide{grid-template-columns:minmax(0,1fr)}
  .tops{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}

<script>
(function(){
'use strict';

/* =========================================================
   Utilidades
   ========================================================= */
const STORE_KEY='nadine_app_v2', OLD_KEY='jeannyconia_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const dayName=d=>DAYS[(d.getDay()+6)%7];
const fmtTime=t=>{if(!t)return '';let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${pad(m)} ${ap}`;};
const fmtDate=s=>{const d=parseISO(s);return `${dayName(d)} ${d.getDate()} ${MS[d.getMonth()]}`;};
const monthLabel=k=>{const [y,m]=k.split('-').map(Number);return `${MONTHS[m-1]} ${y}`;};
const monthShort=k=>MS[Number(k.split('-')[1])-1];
const fmtNum=n=>{n=+n||0;if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+' M';if(Math.abs(n)>=1e5)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return Math.round(n).toLocaleString('en-US');};
const fmtAxis=n=>{const a=Math.abs(n);if(a>=1e6)return +(n/1e6).toFixed(1)+'M';if(a>=1e3)return +(n/1e3).toFixed(1)+'K';return String(Math.round(n*10)/10);};
const money=n=>'$'+(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const pct=(n,d=0)=>n==null||!isFinite(n)?'—':(n>0?'+':'')+n.toFixed(d)+'%';
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sum=(arr,f)=>arr.reduce((a,x)=>a+(+f(x)||0),0);
const byDateTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* =========================================================

const splitLines=s=>String(s||'').split(/\n/).map(x=>x.trim().replace(/^[-•*·✔️✅]+\s*/,'')).filter(Boolean);
function fmtPrice(p){p=String(p||'').trim();if(!p)return '';if(/^\$?\s*\d[\d.,\s]*$/.test(p)){const n=+p.replace(/[$.,\s]/g,'');if(n>0)return '$'+n.toLocaleString('es-CO');}return p;}
function parseProducts(s){return splitLines(s).map(l=>{const parts=l.split('|').map(x=>x.trim());return {name:parts[0]||'',price:fmtPrice(parts[1]),desc:parts.slice(2).join(' | ')};}).filter(p=>p.name);}
const FICHA_KEYS=['sector','description','city','products','productList','promo','audience','pains','benefits','diff','faqs','whatsapp','instagram','schedule','delivery','payment','keywords'];
const fichaPct=w=>{const n=(w&&w.niche)||{};return Math.round(FICHA_KEYS.filter(k=>String(n[k]||'').trim()).length/FICHA_KEYS.length*100);};
function nctx(ws){
  ws=ws||D;const n=ws.niche||{};
  const brand=(ws.name||'la marca').replace(/\s*\(ejemplo\)\s*$/i,'').trim();
  const list=parseProducts(n.productList);
  const sector=(n.sector||'').trim(),aud=(n.audience||'').trim();
  const prodSum=(n.products||'').trim()||(list.length?list.slice(0,2).map(p=>p.name).join(' y '):'');
  let ig=(n.instagram||'').trim();if(ig&&!ig.startsWith('@')&&!/^https?:/i.test(ig)&&!/\./.test(ig))ig='@'+ig;
  return {brand,sector:sector||'nuestro negocio',aud:aud||'nuestros clientes',prod:prodSum||sector||'nuestros productos',
    prodRaw:prodSum,sectorRaw:sector,audRaw:aud,diff:(n.diff||'').trim(),tone:n.tone||'Cercano',goal:n.goal||'Vender más',
    keys:(n.keywords||'').split(',').map(s=>s.trim()).filter(Boolean),hasProfile:!!(sector||prodSum),
    list,desc:(n.description||'').trim(),benefits:splitLines(n.benefits),pains:splitLines(n.pains),faqs:splitLines(n.faqs),
    promo:(n.promo||'').trim(),city:(n.city||'').trim(),schedule:(n.schedule||'').trim(),delivery:(n.delivery||'').trim(),payment:(n.payment||'').trim(),
    wa:(n.whatsapp||'').trim(),ig,web:(n.web||'').trim(),ctaPref:(n.ctaPref||'').trim(),emoji:n.emoji!==false};
}

function createPiece(g){
  const N=nctx(),kind=KINDS[g.kind]?g.kind:'reel',cs=CASES.find(c=>c.id===g.caseId)||CASES[0];
  const C=cctx(N,g.prod,g.detail),o=cs.build(C);
  const pts=o.points.filter(Boolean).map(p=>({show:p.show,say:endP(p.say)}));
  const hook=endP(pick(o.hooks)),cta=o.cta||ctaLine(C,o.word),E=N.emoji;
  const plat=SOCIAL.includes(g.plat)?g.plat:'Instagram';
  const tags=[...new Set(nicheTags(C.P,N).concat([brandTag(N)]).concat(GEN_TAGS[plat]))];
  const bullets=(arr,mark)=>arr.map(p=>`${E?mark:'•'} ${p.say}`).join('\n');
  const copyTxt=n=>`${hook}${E?' ✨':''}\n\n${bullets(pts.slice(0,n),'✔️')}\n\n${cta}${E?' 👇':''}\n\n${tags.slice(0,plat==='TikTok'?5:10).join(' ')}`;
  const r={hook:'',body:'',cta:'',caption:''};
  if(kind==='reel'){
    const secs=[15,30,60,90].includes(+g.secs)?+g.secs:30,n=Math.min(pts.length,{15:2,30:3,60:5,90:6}[secs]),sc=pts.slice(0,n),st=3,en=secs-4,step=(en-st)/Math.max(sc.length,1);
    r.hook=`${hook}\nTexto en pantalla: ${o.short}`;
    r.body=sc.map((p,i)=>`Escena ${i+1} (${Math.round(st+step*i)}–${Math.round(st+step*(i+1))} s)\nEn cámara: ${endP(p.show)}\nDi: “${p.say}”`).join('\n\n');
    r.cta=cta+(plat==='YouTube'?' Y suscríbete para no perderte el próximo video.':'');
    r.caption=copyTxt(3);
  }else if(kind==='carrusel'){
    r.hook=`${hook}\nDiseño: título grande y fondo con el color de la marca.`;
    r.body=pts.map((p,i)=>`Slide ${i+2}: ${p.say}\nImagen: ${endP(p.show)}`).join('\n\n');
    r.cta=`Slide ${pts.length+2}: ${cta}`;r.caption=copyTxt(3);
  }else if(kind==='historias'){
    const st=['Sticker: pregunta “¿Tienes dudas? Escríbenos aquí”','Sticker: deslizador de emoji 😍','Sticker: cuenta regresiva (si hay fecha límite)'];
    r.hook=`${hook}\nFondo: ${endP(pts[0]?pts[0].show:'foto de la marca')}\nSticker: encuesta “¿Lo conocías?” Sí / No`;
    r.body=pts.map((p,i)=>`Historia ${i+2}: ${p.say}\nFondo: ${endP(p.show)}${st[i]?'\n'+st[i]:''}`).join('\n\n');
    r.cta=`Historia ${pts.length+2}: ${cta}\nSticker: ${N.wa||N.web?'enlace a tu WhatsApp o a tu página':'“Envíanos un mensaje”'}`;
    r.caption='Publica las historias seguidas y luego guárdalas en un destacado. Los stickers ayudan a que tus seguidores interactúen.';
  }else if(kind==='copy'){
    r.hook=`${hook}${E?' ✨':''}`;r.body=bullets(pts,'✔️');r.cta=`${cta}${E?' 👇':''}`;r.caption=tags.slice(0,plat==='TikTok'?5:12).join(' ');
  }else if(kind==='whatsapp'){
    r.hook=`Hola${E?' 👋':''}, te escribimos de ${N.brand}.`;
    r.body=`${hook}\n\n${pts.slice(0,3).map(p=>p.say).join(' ')}`;
    r.cta=`Si te interesa, responde este mensaje con la palabra "${o.word}" y te ayudamos.`;
    r.caption='Envíalo por lista de difusión o guárdalo como respuesta rápida en WhatsApp Business. Si puedes, cambia "Hola" por el nombre del cliente.';
  }else{
    const head=o.short.length>40?o.short.slice(0,39).replace(/\s+\S*$/,'')+'…':o.short;
    r.hook=head;r.body=`${hook}\n\n${bullets(pts.slice(0,3),'✅')}\n\n${cta}`;r.cta=`Botón: ${o.button}`;
    r.caption=`Descripción: ${C.price?cap(desde(C.price)):N.city?`${cap(N.sector)} en ${N.city}`:cap(C.B[0])}\nPúblico sugerido: ${N.aud}${N.city?` en ${N.city}`:''}.`;
  }
  const tidy=x=>String(x).replace(/([^.])\.\.(?!\.)/g,'$1.').replace(/([?!…])\.(?=\s|$|”)/g,'$1');
  Object.keys(r).forEach(k=>{r[k]=tidy(r[k]);});
  return Object.assign({title:tidy(`${o.title} · ${KINDS[kind].short}`),kind,platform:plat,note:o.note||'',gen:{v:2,kind,caseId:cs.id,prod:g.prod,plat,secs:g.secs,detail:g.detail}},r);
}

const SCENE_COUNT={15:2,30:3,60:5,90:7};
const NOT_VERB=new Set('lugar hogar collar mujer placer taller celular dolar azucar familiar popular militar bar mar par altar alfiler sabor color amor dolor olor motor tutor licor bazar'.split(' '));
function topicForms(t){
  t=String(t||'').trim();let a='',act=false;const m=t.match(/^(c[oó]mo)\s+(.+)$/i);
  if(m){a=m[2];act=true;}
  else if(/^(qu[eé]|por qu[eé]|cu[aá]les?|cu[aá]ndo|d[oó]nde)(?=\s|$)/i.test(t)){a='saber '+t;act=true;}
  else{const w=norm(t.split(/\s+/)[0]||'');if(w.length>=4&&/(ar|er|ir)$/.test(w)&&!NOT_VERB.has(w)){a=t;act=true;}}
  return {t,act,a,
    con:act?`al intentar ${a}`:`con ${t}`, busca:act?`quieres ${a}`:`buscas ${t}`, logra:act?`logras ${a}`:`encuentras ${t} como lo querías`,
    cuesta:act?`te cuesta ${a}`:`no sabes cómo elegir ${t}`, ama:act?`quiere ${a}`:`ama ${t}`, elegir:act?a:`elegir ${t}`,
    probar:act?`Intentamos ${a}`:`Probamos ${t}`, nofunc:act?`no logras ${a}`:`no tienes resultados con ${t}`, para:act?`para ${a}`:`de ${t}`,
    queria:act?`quería ${a}`:`buscaba ${t}`, vale:act?`¿Se puede ${a}?`:`¿Vale la pena invertir en ${t}?`};
}
function fillTpl(s,t,N){const T=topicForms(t);return s.replace(/\{con\}/g,T.con).replace(/\{t\}/g,t).replace(/\{aud\}/g,N.aud).replace(/\{brand\}/g,N.brand).replace(/\{prod\}/g,N.prod).replace(/\{diffx\}/g,N.diff?': '+N.diff:'');}
function genScript(opts,N){
  N=N||nctx();
  const goal=GOALS[opts.goal]?opts.goal:'vender',secs=SCENE_COUNT[opts.secs]?+opts.secs:30,plat=SOCIAL.includes(opts.plat)?opts.plat:'Instagram';
  const t=(opts.topic||'').trim()||N.prod;
  const k=SCENE_COUNT[secs];
  const scenes=SCENES[goal].slice(0,k).sort((a,b)=>a[0]-b[0]).map(s=>fillTpl(s[1],t,N));
  const start=3,end=secs-4,step=(end-start)/scenes.length;
  const body=scenes.map((s,i)=>`Escena ${i+1} (${Math.round(start+step*i)}–${Math.round(start+step*(i+1))} s): ${s}`).join('\n');
  let cta=pick(CTAS[goal])(N);
  if(plat==='YouTube')cta+=' Y suscríbete para no perderte el próximo video.';
  const hook=pick(HOOKS[goal])(t,N,topicForms(t));
  return {title:`${cap(t)} · ${GOALS[goal]}`,platform:plat,hook:`${hook}\nTexto en pantalla: ${cap(t)}`,body,cta:`${cta}`,
    caption:captionFor(t,N,plat),gen:{topic:t,goal,secs,plat}};
}

function pickPillar(list,n,pillar){
  let pool=pillar&&pillar!=='todos'?list.filter(x=>x[0]===pillar):list.slice();
  if(pillar&&pillar!=='todos')return shuffle(pool).slice(0,n);
  const groups={};shuffle(pool).forEach(x=>{(groups[x[0]]=groups[x[0]]||[]).push(x);});
  const keys=shuffle(Object.keys(groups)),out=[];
  while(out.length<n&&keys.some(k=>groups[k].length)){keys.forEach(k=>{if(out.length<n&&groups[k].length)out.push(groups[k].shift());});}
  return out;
}
const WEEK_PLAN=[['educar','carousel'],['conectar','story'],['vender','video'],['educar','video'],['testimonio','carousel'],['entretener','video'],['conectar','story']];
function generate(cat,topic,platSel,pillar){
  const N=nctx();
  const t=(topic||'').trim().replace(/\s+/g,' ')||N.prod;
  const P=platSel==='Todas'?'Instagram':platSel,T=topicForms(t);
  switch(cat){
    case 'reels':return pickPillar(TPL.reels,6,pillar).map(([p,f])=>({text:f(t,N,T),type:typeFor(P,'video'),pillar:p}));
    case 'carruseles':return pickPillar(TPL.carruseles,6,pillar).map(([p,f])=>({text:f(t,N,T),type:typeFor(P,'carousel'),pillar:p}));
    case 'titulos':return shuffle(TPL.titulos.slice()).slice(0,6).map(f=>({text:f(t,N,T),type:typeFor(P,'video')}));
    case 'guiones':{
      const goals=pillar&&pillar!=='todos'?[pillar,pillar,pillar]:['vender','educar','conectar'];
      return goals.map((g,i)=>{const s=genScript({topic:t,goal:g,secs:[30,30,60][i],plat:P},N);
        return {text:`GANCHO:\n${s.hook}\n\nDESARROLLO:\n${s.body}\n\nCIERRE:\n${s.cta}`,title:s.title,type:typeFor(P,'video'),pillar:g,script:s};});
    }
    case 'descripciones':{
      if(platSel==='Todas')return SOCIAL.map(p=>({text:captionFor(t,N,p),label:p,type:typeFor(p,'video')}));
      return [{text:captionFor(t,N,P),label:P,type:typeFor(P,'video')},{text:captionFor(t,N,P,true),label:'Versión corta',type:typeFor(P,'video')}];
    }
    case 'hashtags':{
      const niche=nicheTags(t,N);
      const plats=platSel==='Todas'?SOCIAL:[P];const wide=new Set();plats.forEach(p=>GEN_TAGS[p].forEach(x=>wide.add(x)));
      const local=new Set(niche);words(t).slice(0,3).forEach(w=>{local.add('#'+w+'tips');local.add('#aprende'+w);});
      return [{text:niche.slice(0,12).join(' ')||'#'+norm(t).replace(/\s+/g,''),label:'Del nicho'},{text:[brandTag(N),...niche.slice(0,4),...wide].slice(0,15).join(' '),label:'Marca + alcance amplio'},{text:[...local].slice(0,12).join(' '),label:'Comunidad y aprendizaje'}];
    }
    case 'calendario':{
      return Array.from({length:7},(_,i)=>{
        const d=addDays(new Date(),i),[p,kind]=WEEK_PLAN[(d.getDay()+6)%7];
        const bank=kind==='carousel'?TPL.carruseles:TPL.reels;const [,f]=pick(bank.filter(x=>x[0]===p));
        const type=typeFor(P,kind),title=f(t,N,T);
        return {text:`${dayName(d)} ${d.getDate()} ${MS[d.getMonth()]} · ${type} · ${GOALS[p]}\n${title}`,title,type,pillar:p,date:iso(d),time:i%2?'18:00':'10:00'};
      });
    }
  }
  return [];
}

function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('nadine-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function kv(op,k,v){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv',op==='get'?'readonly':'readwrite'),st=tx.objectStore('kv');const rq=op==='get'?st.get(k):op==='del'?st.delete(k):st.put(v,k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
const isTyping=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'&&a.type!=='color';};

const stripLocal=o=>JSON.stringify(Object.assign({},o,{activeId:null}));
function mergeData(a,b){
  const del=new Set([...(a.deleted||[]),...(b.deleted||[])]),map=new Map();
  [...b.workspaces,...a.workspaces].forEach(w=>{if(del.has(w.id))return;const cur=map.get(w.id);if(!cur||(w._u||0)>(cur._u||0))map.set(w.id,w);});
  let wss=[...map.values()].sort((x,y)=>(x.created||0)-(y.created||0));if(!wss.length)wss=[blankWs()];
  const user=((a.user&&a.user._u)||0)>=((b.user&&b.user._u)||0)?a.user:b.user;
  return {version:2,user,activeId:wss.some(w=>w.id===a.activeId)?a.activeId:wss[0].id,workspaces:wss,deleted:[...del].slice(-300)};
}
function applyIncoming(next){

}
async function fsInit(){
  if(!FS_OK)return;
  try{const h=await kv('get','dataFile');if(!h){fsSet('off');return;}
    FS.h=h;FS.name=h.name;const p=await h.queryPermission({mode:'readwrite'});
    if(p==='granted'){FS.state='ok';await fsPull(true);fsSet('ok');}else fsSet('perm');
  }catch(e){fsSet('off');}
}
async function fsConnectNew(){
  try{const h=await window.showSaveFilePicker({suggestedName:'nadine-datos.json',types:FILE_TYPES});
    FS.h=h;FS.name=h.name;try{await kv('put','dataFile',h);}catch(e){}
    FS.state='ok';FS.lastMod=0;await fsWrite();fsSet('ok');toast('Listo: tus datos se guardan en '+h.name);
  }catch(e){if(!e||e.name!=='AbortError')toast('No se pudo crear el archivo');}
}
async function fsConnectExisting(){
  let h,f,o=null;
  try{[h]=await window.showOpenFilePicker({types:FILE_TYPES,multiple:false});}catch(e){if(!e||e.name!=='AbortError')toast('No se pudo abrir el archivo');return;}
  try{f=await h.getFile();const txt=await f.text();
    if(txt.trim()){o=JSON.parse(txt);if(!o||typeof o!=='object'||!(Array.isArray(o.workspaces)||Array.isArray(o.content)))throw new Error('formato');}
  }catch(e){toast('Ese archivo no es un archivo de datos de la app');return;}
  try{if((await h.requestPermission({mode:'readwrite'}))!=='granted'){toast('Necesito permiso para guardar en ese archivo');return;}}catch(e){toast('No se pudo obtener permiso para el archivo');return;}
  ui.pendingFile={h,o:o?normalize(o):null,mod:f.lastModified};
  if(!o){fsFinishConnect(true);return;}
  openModal(`<h2>Conectar archivo</h2><p style="margin-top:0">El archivo <b>${esc(h.name)}</b> ya tiene información (${(o.workspaces||[1]).length} ${(o.workspaces||[1]).length===1?'empresa':'empresas'}). ¿Qué hago con lo que hay en este navegador?</p>
    <div class="choice"><button class="btn primary" data-act="fileUseFile">Usar solo los datos del archivo (recomendado)</button><button class="btn" data-act="fileMerge">Combinar con los datos de este navegador</button></div>
    <p class="small muted">Con la primera opción ves exactamente lo mismo que en el otro navegador.</p>
    <div class="modal-foot"><span></span><button class="btn ghost" data-act="closeModal">Cancelar</button></div>`);
}
async function fsFinishConnect(merge){
  const pf=ui.pendingFile;if(!pf)return;ui.pendingFile=null;closeModal();
  FS.h=pf.h;FS.name=pf.h.name;try{await kv('put','dataFile',pf.h);}catch(e){}
  FS.state='ok';FS.lastMod=pf.mod;
  if(pf.o){const keep=S.activeId;const next=merge?mergeData(S,pf.o):Object.assign(pf.o,{activeId:pf.o.workspaces.some(w=>w.id===keep)?keep:pf.o.activeId});
    if(!merge)next.deleted=[...new Set([...(next.deleted||[]),...S.workspaces.map(w=>w.id).filter(id=>!next.workspaces.some(w=>w.id===id))])];
    resetWsUi();applyIncoming(next);if(merge)await fsWrite();}
  else await fsWrite();
  fsSet('ok');toast('Archivo conectado: '+FS.name);
}
async function fsReconnect(){
  if(!FS.h){go('configuracion');return;}
  try{const p=await FS.h.requestPermission({mode:'readwrite'});if(p==='granted'){FS.state='ok';await fsPull(true);fsSet('ok');toast('Datos reconectados ✓');}else toast('Sin permiso no puedo usar el archivo');}
  catch(e){toast('No se pudo reconectar. Conecta el archivo otra vez en Configuración.');}
}
async function fsDisconnect(){try{await kv('del','dataFile');}catch(e){}FS.h=null;FS.name='';fsSet('off');toast('Archivo desconectado');}
async function fsWrite(){
  if(!FS.h||FS.state!=='ok')return;
  if(FS.writing){FS.again=true;return;}
  FS.writing=true;
  try{
    const f=await FS.h.getFile();
    if(FS.lastMod&&f.lastModified>FS.lastMod){const txt=await f.text();if(txt.trim()){try{const remote=normalize(JSON.parse(txt));const m=mergeData(S,remote);if(stripLocal(m)!==stripLocal(S))applyIncoming(m);}catch(e){}}}
    const w=await FS.h.createWritable();await w.write(JSON.stringify(S));await w.close();
    const f2=await FS.h.getFile();FS.lastMod=f2.lastModified;FS.lastSync=Date.now();
  }catch(e){if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))fsSet('perm');}
  FS.writing=false;
  if(FS.again){FS.again=false;fsWrite();}
}
async function fsPull(initial){
  if(!FS.h||FS.state!=='ok'||FS.writing||fileWriteT)return;
  try{const f=await FS.h.getFile();
    if(!initial&&f.lastModified<=FS.lastMod)return;
    const txt=await f.text();FS.lastMod=f.lastModified;FS.lastSync=Date.now();
    if(!txt.trim()){await fsWrite();return;}
    const remote=normalize(JSON.parse(txt)),m=mergeData(S,remote);
    if(stripLocal(m)!==stripLocal(S))applyIncoming(m);
    if(stripLocal(m)!==stripLocal(Object.assign({},remote,{deleted:m.deleted})))scheduleFileWrite();
  }catch(e){if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))fsSet('perm');}
}
let fileWriteT=null;
function scheduleFileWrite(){if(!FS.h||FS.state!=='ok')return;clearTimeout(fileWriteT);fileWriteT=setTimeout(()=>{fileWriteT=null;fsWrite();},450);}
function flushFileWrite(){if(fileWriteT){clearTimeout(fileWriteT);fileWriteT=null;fsWrite();}}
const ago=t=>{const s=Math.round((Date.now()-t)/1000);return s<60?'hace unos segundos':s<3600?`hace ${Math.round(s/60)} min`:`hace ${Math.round(s/3600)} h`;};

function readLogo(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//.test(file.type)){reject('Elige una imagen PNG, JPG, WEBP o SVG');return;}
    if(file.size>8*1024*1024){reject('La imagen pesa más de 8 MB');return;}
    const fr=new FileReader();fr.onerror=()=>reject('No se pudo leer la imagen');
    fr.onload=()=>{const img=new Image();img.onerror=()=>reject('No se pudo abrir la imagen');
      img.onload=()=>{const MAX=360,w=img.naturalWidth||MAX,h=img.naturalHeight||MAX,k=Math.min(1,MAX/Math.max(w,h));
        const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
        const ctx=c.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,c.width,c.height);
        let out=c.toDataURL('image/png');if(out.length>900000)out=c.toDataURL('image/webp',0.9);resolve(out);};
      img.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

function vPlan(){
  const mon=ui.week,sun=addDays(mon,6),today=iso(new Date());
  const weekAll=D.content.filter(c=>c.date>=iso(mon)&&c.date<=iso(sun));
  const list=ui.filter==='todos'?weekAll:weekAll.filter(c=>c.type===ui.filter);
  const label=mon.getMonth()===sun.getMonth()?`${mon.getDate()} – ${sun.getDate()} ${MS[sun.getMonth()]} ${sun.getFullYear()}`:`${mon.getDate()} ${MS[mon.getMonth()]} – ${sun.getDate()} ${MS[sun.getMonth()]} ${sun.getFullYear()}`;
  const right=`<div class="week-nav"><button class="icon-btn" data-act="weekPrev" aria-label="Semana anterior">${ic('left',17)}</button><span>${ic('calendar',15)} ${label}</span><button class="icon-btn" data-act="weekNext" aria-label="Semana siguiente">${ic('right',17)}</button></div>
    ${iso(mon)!==iso(mondayOf(new Date()))?`<button class="btn" data-act="weekToday">Hoy</button>`:''}<button class="btn primary" data-act="newContent">${ic('plus',16,2)} Nuevo contenido</button>`;
  const chips=`<div class="chips"><button class="chip ${ui.filter==='todos'?'active':''}" data-act="filter" data-f="todos">Todos (${weekAll.length})</button>${TYPES.map(t=>`<button class="chip ${ui.filter===t?'active':''}" data-act="filter" data-f="${t}">${TYPE_PLURAL[t]} (${weekAll.filter(c=>c.type===t).length})</button>`).join('')}</div>`;
  let days='';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),k=iso(d),items=list.filter(c=>c.date===k).sort(byDateTime);
    days+=`<div class="day ${k===today?'today':''}"><div class="day-h"><div class="dn">${DAYS[i]}</div><div class="dd">${d.getDate()}</div></div>
      ${items.map(c=>`<button class="post" data-act="editContent" data-id="${c.id}">${thumb(c.type,20)}<div class="pbody">${badge(c.type)}<div class="pt">${esc(c.title)}</div><div class="pm"><span class="sdot" style="background:${(STATUS[c.status]||STATUS.idea).color}"></span>${ic('clock',12)} ${fmtTime(c.time)}</div></div></button>`).join('')}
      <button class="add-slot" data-act="newContent" data-date="${k}">${ic('plus',17)} Agregar contenido</button></div>`;
  }
  return pageHead('Planificador de contenido','Organiza, crea y programa el contenido de esta empresa.',right)+chips+`<div class="week">${days}</div>
    <p class="small muted" style="margin-top:12px;display:flex;gap:14px;flex-wrap:wrap">${Object.values(STATUS).map(s=>`<span style="display:inline-flex;align-items:center;gap:6px"><span class="sdot" style="background:${s.color}"></span>${s.label}</span>`).join('')}</p>`;
}

function scale(v){if(!v||v<=0)v=10;const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;const k=Math.ceil(v/step);return {max:k*step,k,step};}
function lineChart(data){
  const W=window.innerWidth<600?400:640,H=window.innerWidth<600?230:250,pl=46,pr=22,pt=46,pb=30,iw=W-pl-pr,ih=H-pt-pb;
  const {max,k:K}=scale(Math.max(...data.map(d=>d.value))*1.05);
  const x=i=>pl+(data.length===1?iw/2:i*iw/(data.length-1)),y=v=>pt+ih-(v/max)*ih;
  let g='';for(let i=0;i<=K;i++){const v=max*i/K,yy=y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${TH.grid}"/><text x="${pl-10}" y="${+yy+4}" text-anchor="end" font-size="11" fill="${TH.axis}">${fmtAxis(v)}</text>`;}
  const pts=data.map((d,i)=>[x(i),y(d.value)]),line='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  const area=`${line} L${pts[pts.length-1][0].toFixed(1)},${pt+ih} L${pts[0][0].toFixed(1)},${pt+ih} Z`;
  const xl=data.map((d,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${TH.axis}">${esc(d.label)}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?TH.brand:TH.card}" stroke="${TH.brand}" stroke-width="2"><title>${esc(data[i].label)}: ${fmtNum(data[i].value)}</title></circle>`).join('');
  const [lx,ly]=pts[pts.length-1],bx=Math.min(Math.max(lx-44,pl),W-88);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Crecimiento de seguidores"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${TH.brand}" stop-opacity=".28"/><stop offset="1" stop-color="${TH.brand}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#lg1)"/><path d="${line}" fill="none" stroke="${TH.brand}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}<rect x="${bx}" y="${ly-42}" width="88" height="32" rx="7" fill="${TH.brand}"/><text x="${bx+44}" y="${ly-27}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${TH.onBrand}">${fmtNum(data[data.length-1].value)}</text><text x="${bx+44}" y="${ly-15}" text-anchor="middle" font-size="9.5" fill="${TH.onBrandSoft}">seguidores</text></svg>`;
}
function multiLine(labels,series,unit){
  const W=window.innerWidth<600?400:640,H=window.innerWidth<600?240:260,pl=50,pr=20,pt=20,pb=30,iw=W-pl-pr,ih=H-pt-pb;
  const vals=series.flatMap(s=>s.values).filter(v=>v!=null);if(!vals.length)return empty('chart','No hay datos suficientes.');
  let lo=Math.min(0,...vals),hi=Math.max(...vals,1);const {step}=scale((hi-lo)*1.1);lo=Math.floor(lo/step)*step;let top=lo;while(top<hi)top+=step;if(top===hi)top+=step;
  const x=i=>pl+(labels.length===1?iw/2:i*iw/(labels.length-1)),y=v=>pt+ih-((v-lo)/(top-lo))*ih;
  let g='';for(let v=lo;v<=top+1e-9;v+=step){const yy=y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${Math.abs(v)<1e-9?TH.zero:TH.grid}"/><text x="${pl-10}" y="${+yy+4}" text-anchor="end" font-size="11" fill="${TH.axis}">${fmtAxis(v)}${unit}</text>`;}
  const xl=labels.map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${TH.axis}">${esc(l)}</text>`).join('');
  const lines=series.map(s=>{let d='',pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?' L':' M')+x(i).toFixed(1)+','+y(v).toFixed(1);pen=true;});
    const dots=s.values.map((v,i)=>v==null?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${TH.card}" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} · ${esc(labels[i])}: ${v.toFixed(1)}${unit}</title></circle>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Comparativo">${g}${lines}${xl}</svg><div class="legend-row">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function donut(parts){
  const total=sum(parts,p=>p.value);if(!total)return empty('users','Registra los seguidores por red para ver la distribución.');
  const r=54,C=2*Math.PI*r;let off=0;
  const segs=parts.filter(p=>p.value>0).map(p=>{const len=p.value/total*C;const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${Math.max(len-1.5,0.1).toFixed(2)} ${(C-len+1.5).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${p.label}: ${fmtNum(p.value)}</title></circle>`;off+=len;return s;}).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 140 140" width="160" height="160" role="img" aria-label="Audiencia por plataforma">${segs}<text x="70" y="69" text-anchor="middle" font-size="16" font-weight="800" fill="${TH.text}">${fmtNum(total)}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="${TH.axis}">seguidores</text></svg>
    <ul class="legend">${parts.map(p=>`<li><i style="background:${p.color}"></i>${p.label}<b>${Math.round(p.value/total*100)}%</b></li>`).join('')}</ul></div>`;
}
function barChart(data){
  const W=440,H=240,pl=50,pr=14,pt=48,pb=30,iw=W-pl-pr,ih=H-pt-pb,n=data.length;
  const {max,k:K}=scale(Math.max(...data.map(d=>d.value))*1.05);
  const y=v=>pt+ih-(v/max)*ih,slot=iw/n,bw=Math.min(34,slot*.55);
  let g='';for(let i=0;i<=K;i++){const v=max*i/K,yy=y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${TH.grid}"/><text x="${pl-10}" y="${+yy+4}" text-anchor="end" font-size="11" fill="${TH.axis}">$${fmtAxis(v)}</text>`;}
  const bars=data.map((d,i)=>{const cx=pl+slot*i+slot/2,top=y(d.value),last=i===n-1;
    return `<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(pt+ih-top,0).toFixed(1)}" rx="5" fill="${last?TH.brand:TH.brandLight}"><title>${esc(d.label)}: ${money(d.value)}</title></rect><text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${TH.axis}">${esc(d.label)}</text>`;}).join('');
  const l=data[n-1],lx=pl+slot*(n-1)+slot/2,ly=y(l.value),bx=Math.min(Math.max(lx-36,pl),W-72);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Ingresos por mes">${g}${bars}<rect x="${bx}" y="${ly-36}" width="72" height="26" rx="7" fill="${TH.brand}"/><text x="${bx+36}" y="${ly-19}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${TH.onBrand}">${money(l.value)}</text></svg>`;
}
function hbars(items,fmt){
  if(!items.length)return empty('chart','Sin datos para este mes.');
  const max=Math.max(...items.map(i=>Math.abs(i.value)),1e-9);
  return [...items].sort((a,b)=>b.value-a.value).map(i=>`<div class="hb"><div class="hb-l">${avatar(i.w,22)}<span>${esc(i.w.name)}</span></div><div class="hb-track"><div class="hb-bar" style="width:${Math.max(2,Math.abs(i.value)/max*100).toFixed(1)}%;background:${i.value<0?'#dc2626':esc(i.w.color)}"></div></div><b>${fmt(i.value)}</b></div>`).join('');
}

/* =========================================================

   ========================================================= */
function compareData(){
  const months=[...new Set(S.workspaces.flatMap(w=>w.stats.map(m=>m.month)))].sort();
  const sel=ui.cmpMonth&&months.includes(ui.cmpMonth)?ui.cmpMonth:months[months.length-1];
  const rows=S.workspaces.map(w=>({w,s:sel?wsSummary(w,sel):null}));
  return {months,sel,rows};
}
function vCompare(){
  const {months,sel,rows}=compareData();
  if(!months.length)return pageHead('Comparativo','Compara los resultados de todas tus empresas.','',false)+`<div class="card">${empty('scale','Registra estadísticas en al menos una empresa para compararlas aquí.',`<button class="btn primary sm" data-act="nav" data-tab="estadisticas">Ir a Estadísticas</button>`)}</div>`;
  const right=`<label class="pill">${ic('calendar',16)}<select id="cmp-month" aria-label="Mes">${months.slice().reverse().map(m=>`<option value="${m}" ${m===sel?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></label>
    <button class="btn" data-act="exportCsv">${ic('download',16)} Excel (CSV)</button><button class="btn primary" data-act="print">${ic('printer',16)} Informe PDF</button>`;
  const withData=rows.filter(r=>r.s);
  const best=(f,fmt,label,icon,tint)=>{const c=withData.filter(r=>f(r.s)!=null).sort((a,b)=>f(b.s)-f(a.s))[0];
    return `<div class="kpi ${tint} hl"><div class="k-top">${ic(icon,18)} ${label}</div>${c?`<div class="k-val">${fmt(f(c.s))}</div><div class="who">${avatar(c.w,22)}<span>${esc(c.w.name)}</span></div>`:'<div class="k-val">—</div>'}</div>`;};
  const hl=`<div class="grid g4">${best(s=>s.growth,v=>pct(v,1),'Mayor crecimiento','trophy','tint-green')}${best(s=>s.income,money,'Más ingresos','dollar','tint-violet')}${best(s=>s.eng,v=>v.toFixed(1)+'%','Mejor interacción','heart','tint-rose')}${best(s=>s.followers,fmtNum,'Más seguidores','users','tint-blue')}</div>`;
  const cell=(v,f,good)=>v==null?'<span class="muted">—</span>':`<span class="${good?(v>=0?'up':'down'):''}" style="${good?'font-weight:700':''}">${f(v)}</span>`;
  const table=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Empresa</th><th>Seguidores</th><th>Crecimiento</th><th>Alcance</th><th>Interacciones</th><th>Tasa de interacción</th><th>Ventas</th><th>Ingresos</th><th>Var. ingresos</th><th>Publicados</th></tr></thead><tbody>
    ${rows.map(({w,s})=>`<tr><td><span class="wcell">${avatar(w,24)}${esc(w.name)}</span></td>${s?`<td>${fmtNum(s.followers)}</td><td>${cell(s.growth,v=>pct(v,1),true)}</td><td>${fmtNum(s.reach)}</td><td>${fmtNum(s.inter)}</td><td>${cell(s.eng,v=>v.toFixed(1)+'%')}</td><td>${fmtNum(s.sales)}</td><td>${money(s.income)}</td><td>${cell(s.incomeGrowth,v=>pct(v,1),true)}</td><td>${s.posts}</td>`:'<td colspan="9" class="muted">Sin datos para este mes</td>'}</tr>`).join('')}
    </tbody></table></div>`;
  const win=months.filter(m=>m<=sel).slice(-6);
  const series=S.workspaces.map(w=>{const ms=sortedStats(w);let base=null;
    const values=win.map(m=>{const r=ms.find(x=>x.month===m);if(!r)return null;const f=totalFollowers(r);if(base==null){base=f;}return base?(f/base-1)*100:null;});
    return {name:w.name,color:w.color,values};}).filter(s=>s.values.some(v=>v!=null));
  return printHead('Comparativo de empresas',monthLabel(sel))+
    pageHead('Comparativo',`Resultados de todas tus empresas en ${monthLabel(sel)}.`,right,false)+hl+
    `<div class="card mt"><div class="card-h"><h3>Resumen del mes</h3><span class="small muted">Crecimiento y variación frente al mes anterior</span></div>${table}</div>
    <div class="grid g-wide mt">
      <div class="card"><div class="card-h"><h3>Crecimiento acumulado de seguidores</h3><span class="small muted">desde ${monthLabel(win[0])}</span></div>${multiLine(win.map(monthShort),series,'%')}</div>
      <div class="card"><div class="card-h"><h3>Ingresos del mes</h3></div>${hbars(withData.map(r=>({w:r.w,value:r.s.income})),money)}</div>
    </div>
    <div class="grid g2 mt">
      <div class="card"><div class="card-h"><h3>Crecimiento de seguidores</h3><span class="small muted">vs mes anterior</span></div>${hbars(withData.filter(r=>r.s.growth!=null).map(r=>({w:r.w,value:r.s.growth})),v=>pct(v,1))}</div>
      <div class="card"><div class="card-h"><h3>Tasa de interacción</h3><span class="small muted">interacciones ÷ alcance</span></div>${hbars(withData.filter(r=>r.s.eng!=null).map(r=>({w:r.w,value:r.s.eng})),v=>v.toFixed(1)+'%')}</div>
    </div>
    <p class="small muted mt">La <b>tasa de interacción</b> es interacciones ÷ alcance. El <b>crecimiento acumulado</b> compara cada empresa contra su propio punto de partida, así puedes comparar marcas grandes y pequeñas en la misma gráfica.</p>`;
}
function exportCsv(){
  const {sel,rows}=compareData();
  const dec=v=>v==null?'':String(Math.round(v*10)/10).replace('.',',');
  const lines=[['Empresa','Nicho','Mes','Seguidores','Crecimiento %','Alcance','Interacciones','Tasa de interacción %','Ventas','Ingresos','Variación ingresos %','Publicados'].join(';')];
  rows.forEach(({w,s})=>{lines.push([w.name,(w.niche||{}).sector||'',monthLabel(sel),s?s.followers:'',s?dec(s.growth):'',s?s.reach:'',s?s.inter:'',s?dec(s.eng):'',s?s.sales:'',s?String(s.income).replace('.',','):'',s?dec(s.incomeGrowth):'',s?s.posts:''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'));});
  download(`comparativo-${sel}.csv`,'﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');toast('Archivo descargado ✓');
}
function download(name,content,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

  if(FS.state==='ok')body=`<p style="margin-top:0">Tus datos se guardan en el archivo <b>${esc(FS.name)}</b>${FS.lastSync?` · última sincronización ${ago(FS.lastSync)}`:''}. En el otro navegador abre la app, entra aquí y toca <b>Usar un archivo existente</b> para elegir este mismo archivo.</p><div class="head-actions"><button class="btn" data-act="fsDisconnect">Desconectar</button></div>`;
  else if(FS.state==='perm')body=`<p style="margin-top:0">El navegador pide permiso otra vez para usar <b>${esc(FS.name)}</b>. Es normal después de cerrar el navegador.</p><div class="head-actions"><button class="btn primary" data-act="fsReconnect">Reconectar archivo</button><button class="btn" data-act="fsDisconnect">Desconectar</button></div>`;
  else body=`<p class="muted" style="margin-top:0">Chrome y Edge guardan sus datos por separado. Conéctalos al mismo archivo de tu computador y verás la misma información en los dos.</p>
    <ol class="steps"><li>En el primer navegador toca <b>Crear archivo de datos</b> y guárdalo, por ejemplo, en Documentos.</li><li>En el otro navegador abre la app, entra a Configuración, toca <b>Usar un archivo existente</b> y elige ese mismo archivo.</li><li>Listo: lo que hagas en uno aparece en el otro en pocos segundos.</li></ol>
    <div class="head-actions"><button class="btn primary" data-act="fsNew">${ic('plus',16,2)} Crear archivo de datos</button><button class="btn" data-act="fsOpen">${ic('upload',16)} Usar un archivo existente</button></div>
    <p class="small muted" style="margin-bottom:0">Tip: si guardas el archivo en una carpeta de OneDrive o Google Drive, también lo puedes usar desde otro computador.</p>`;
  return `<div class="card">${head}${body}</div>`;
}

function go(tab){
  if(ui.tab==='guiones')persistEditor();
  flushFicha();
  closeMenu();closeModal();
  if(location.hash!=='#'+tab){location.hash=tab;}else{ui.tab=tab;render();}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(VALID_TABS.includes(t)){if(ui.tab==='guiones')persistEditor();ui.tab=t;render();window.scrollTo(0,0);}});
function closeMenu(){document.body.classList.remove('menu-open');}
function openModal(html){$('#modal-box').innerHTML=html;$('#modal').classList.add('open');}
function closeModal(){$('#modal').classList.remove('open');$('#modal-box').innerHTML='';}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300);}
function copyText(text){
  const done=()=>toast('Copiado ✓');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('No se pudo copiar');}ta.remove();}
}
const num=id=>{const v=$(id).value;return v===''?0:Math.max(0,+v||0);};
function keepProfileDrafts(){const b=$('#cf-brand'),n=$('#cf-name'),s=$('#cf-showname');if(b)S.user.brand=b.value.trim()||S.user.brand;if(n)S.user.name=n.value.trim()||S.user.name;if(s)S.user.showName=s.checked;}

  importData:()=>$('#import-file').click(),
  resetDemo:()=>{if(!confirm('Esto reemplaza todas tus empresas por las empresas de ejemplo. ¿Continuar?'))return;{const old=S.workspaces.map(w=>w.id);S=seed(S.user);S.deleted=old;}bindD();applyTheme();resetWsUi();save();render();toast('Empresas de ejemplo cargadas');},
  wipeAll:()=>{if(!confirm('Se borrarán todas las empresas con su contenido, ideas, guiones, flujos y estadísticas de este dispositivo. ¿Seguro?'))return;
    const w=blankWs(),old=S.workspaces.map(x=>x.id);S={version:2,user:S.user,activeId:w.id,workspaces:[w],deleted:old};bindD();resetWsUi();save();go('empresas');setTimeout(()=>wsModal(D),150);toast('Listo: crea el perfil de tu primera empresa');},
  installApp:()=>{
    if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render();});return;}
    const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua),edge=/Edg\//.test(ua),android=/android/i.test(ua),file=location.protocol==='file:';
    let steps;
    if(isStandalone())steps=`<p style="margin-top:0">${ic('check',16,2)} Ya estás usando la app instalada.</p>`;
    else if(file)steps=`<div class="warn-box">${ic('info',20)}<p><b>Estás abriendo la app como un archivo de tu computador.</b> Así no se puede instalar. Publícala primero (arrastra la carpeta a <b>app.netlify.com/drop</b>) y abre ese enlace en Chrome o Edge.</p></div>`;
    else if(ios)steps=`<div class="hint">En iPhone o iPad abre esta página en <b>Safari</b>, toca <b>Compartir</b> (cuadro con flecha) y elige <b>Agregar a inicio</b>.</div>`;
    else if(android)steps=`<div class="hint">En Chrome toca el menú <b>⋮</b> y elige <b>Instalar app</b> (o <b>Agregar a la pantalla principal</b>).</div>`;
    else if(edge)steps=`<div class="hint"><b>En Edge:</b> toca el menú <b>⋯</b> (arriba a la derecha) → <b>Más herramientas</b> → <b>Aplicaciones</b> → <b>Instalar este sitio como una aplicación</b> → <b>Instalar</b>. En algunas versiones, “Aplicaciones” aparece directamente en el menú ⋯.</div>`;
    else steps=`<div class="hint"><b>En Chrome:</b> toca el ícono de instalar (pantalla con flecha) al final de la barra de direcciones, o el menú <b>⋮</b> → <b>Transmitir, guardar y compartir</b> → <b>Instalar página como app</b>.</div>`;
    openModal(`<h2>Instalar en este equipo</h2>${steps}
      <p class="small muted">La app instalada abre en su propia ventana, con ícono en el escritorio y en el menú Inicio, y funciona sin internet. La que instales desde Chrome comparte los datos con Chrome, y la de Edge con Edge: para ver lo mismo en las dos, conecta el archivo de datos en <b>Configuración</b>.</p>
      <div class="modal-foot"><span></span><button class="btn primary" data-act="closeModal">Entendido</button></div>`);
  }
};
function scriptFromIdea(r){
  const N=nctx(),goal=r.pillar||'educar';
  if(r.script){addScript(Object.assign({},r.script,{title:r.title||r.script.title}));toast('Guion listo en Guiones ✓');return;}
  const s=genScript({topic:ui.lastTopic||N.prod,goal,secs:30,plat:ui.ideaPlat==='Todas'?'Instagram':ui.ideaPlat},N);
  const idea=r.title||lastLine(r.text);
  s.title=idea;s.hook=`${idea}${/[.?!…]$/.test(idea)?'':'.'}\nTexto en pantalla: ${idea}`;
  addScript(s);toast('Guion creado a partir de la idea ✓');
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(!fn)return;e.preventDefault();fn(el,e);});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='topic')ui.topic=e.target.value;
  if(id==='c-detail')ui.cDetail=e.target.value;
  if(e.target.dataset&&e.target.dataset.nf!==undefined)fichaInput(e.target);
  if(e.target.dataset&&e.target.dataset.wsf==='name'){D.name=e.target.value.trim()||'Empresa';renderSidebar();fichaSoon();}
  if(id==='th-custom'){S.user.theme=Object.assign(themeCfg(),{color:e.target.value});applyTheme();}
  if(e.target.closest&&e.target.closest('#script-editor')){updateDuration();clearTimeout(autosaveT);autosaveT=setTimeout(persistEditor,600);}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='stats-month'){ui.statsMonth=e.target.value;render();}
  if(id==='cmp-month'){ui.cmpMonth=e.target.value;render();}
  if(id==='sc-plat')persistEditor();
  if(['c-case','c-prod','c-plat','c-secs'].includes(id)){readCreator();if(id==='c-case'){const cs=CASES.find(c=>c.id===ui.cCase),d=$('#c-detail'),lb=document.querySelector('label[for="c-detail"]');if(cs&&d)d.placeholder=cs.ph;if(cs&&lb)lb.textContent='Detalle'+(cs.need?'':' (opcional)');}}
  if(id==='th-custom'){save();render();}
  if(id==='th-ws'){S.user.theme=Object.assign(themeCfg(),{wsColor:e.target.checked});applyTheme();save();render();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='topic'){e.preventDefault();doGenerate();}
  if(e.key==='Enter'&&e.target.id==='c-detail'){e.preventDefault();A.makePiece();}
  if(e.key==='Escape'){if($('#modal').classList.contains('open'))closeModal();else closeMenu();}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
$('#import-file').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!(Array.isArray(o.workspaces)||Array.isArray(o.content)))throw new Error();
      if(!confirm('¿Reemplazar los datos de este dispositivo por los de la copia?'))return;
      {const old=S.workspaces.map(w=>w.id);S=normalize(o);S.deleted=[...new Set([...(S.deleted||[]),...old.filter(id=>!S.workspaces.some(w=>w.id===id))])];}bindD();resetWsUi();snaps=new Map();userSnap='';save();applyTheme();render();toast('Copia importada ✓');}catch(err){toast('Ese archivo no es una copia válida');}
    e.target.value='';};
  r.readAsText(file);
});
$('#logo-file').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  readLogo(file).then(url=>{keepProfileDrafts();S.user.logo=url;if(S.user.showName===undefined)S.user.showName=true;
    if(!persist(S)){delete S.user.logo;toast('El logo es muy pesado, prueba con una imagen más liviana');return;}save();render();toast('Logo actualizado ✓');}).catch(m=>toast(String(m)));
});
$('#ws-logo-file').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  if(ui.logoTarget==='ficha'){ui.logoTarget=null;readLogo(file).then(url=>{flushFicha();D.logo=url;if(!persist(S)){delete D.logo;toast('El logo es muy pesado, prueba con una imagen más liviana');return;}save();render();toast('Logo actualizado ✓');}).catch(m=>toast(String(m)));return;}
  if(!ui.wsDraft)return;
  readLogo(file).then(url=>{ui.wsDraft.logo=url;const p=$('#w-logo-prev');if(p){p.classList.add('has');p.innerHTML=`<img src="${url}" alt="">`;}const d=$('#w-logo-del');if(d)d.style.display='';}).catch(m=>toast(String(m)));
});
window.addEventListener('beforeunload',()=>{if(ui.tab==='guiones')persistEditor();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(ui.tab==='guiones')persistEditor();flushFicha();flushFileWrite();}else if(FS.state==='ok')fsPull(false);});
window.addEventListener('focus',()=>{if(FS.state==='ok')fsPull(false);});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(ui.needRender&&!isTyping()&&!modalOpen())render();},200);});

/* ---------- instalación (PWA) ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(ui.tab==='inicio'&&!isTyping()&&!modalOpen())render();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('¡App instalada! 🎉');render();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}

/* ---------- inicio ---------- */
document.querySelectorAll('[data-ic]').forEach(el=>{el.innerHTML=ic(el.dataset.ic,22);});
applyTheme();
render();
fsInit();
setInterval(()=>{if(!document.hidden&&FS.state==='ok')fsPull(false);},4000);
if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)'),onMq=()=>{if(themeCfg().mode==='auto'){applyTheme();if(!isTyping())render();}};if(mq.addEventListener)mq.addEventListener('change',onMq);else if(mq.addListener)mq.addListener(onMq);}
})();
</script>
</body>
